name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, pdo
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Lint Twig
        run: php bin/console lint:twig ./templates

      - name: Lint Yaml
        run: php bin/console lint:yaml ./config --parse-tags

      - name: Lint Container
        run: php bin/console lint:container

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, pdo, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit - unit
        run: vendor/bin/phpunit

  functional-test:
    name: Functional Test
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: appshop_test
          MYSQL_USER: appshop
          MYSQL_PASSWORD: appshop
          MYSQL_ROOT_PASSWORD: appshop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://appshop:appshop@127.0.0.1:3306/appshop_test?serverVersion=8.4.0&charset=utf8mb4"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, pdo, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Wait MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Schema
        run: |
          php bin/console doctrine:schema:create --env=test

      - name: PHPUnit - functional
        run: vendor/bin/phpunit tests/Functional

