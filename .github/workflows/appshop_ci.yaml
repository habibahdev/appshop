name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, pdo
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Lint Twig
        run: php bin/console lint:twig ./templates

      - name: Lint Yaml
        run: php bin/console lint:yaml ./config --parse-tags

      - name: Lint Container
        run: php bin/console lint:container

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, pdo
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit - unitaire
        run: vendor/bin/phpunit